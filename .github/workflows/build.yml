name: Build ZMK Firmware

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout ZMK
        uses: actions/checkout@v4
        with:
          repository: zmkfirmware/zmk
          ref: main

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.west
            bootloader
            modules
            tools
            zephyr
            zmk
          key: ${{ runner.os }}-zmk-${{ hashFiles('**/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-zmk-

      - name: Initialize West Workspace
        run: |
          west init -l app
          west update
          west zephyr-export

      - name: Copy User Config
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: Build Firmware
        run: |
          west build -s app -b nice_nano -- \
            -DZMK_CONFIG="$(pwd)/config-repo/config" \
            -DZEPHYR_EXTRA_MODULES="$(pwd)/app" \
            -DEXTRA_DTC_FLAGS="-I$(pwd)/app/include"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmk-nice_nano
          path: build/zephyr/zmk.uf2
