name: Build BLE Beacon Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
          key: west-${{ hashFiles('app/west.yml') }}

      - name: West init and update
        run: |
          cd app
          west init -l .
          west update
          west zephyr-export

      - name: Build firmware
        run: |
          west build -b nice_nano_v2 app

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: ble-beacon-nice-nano
          path: build/zephyr/zephyr.uf2
