# ---------------------------------------------------------------------------
# Bluetooth
#
# NOTE: this is a plain Zephyr application, NOT a ZMK keyboard.
# Bluetooth therefore has to be enabled with the *Zephyr* symbols below.
# CONFIG_ZMK_BLE / CONFIG_ZMK_KEYBOARD_NAME have no effect here.
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_Blinky"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=2

# No bonding/settings storage: the fixture must always be freely connectable.
CONFIG_BT_SETTINGS=n
CONFIG_SETTINGS=n

# Max TX power (+8 dBm) on the nRF52840 controller.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_LOG=y

# ---------------------------------------------------------------------------
# USB CDC-ACM console (/dev/ttyACM0) used for the diagnostic log
# ---------------------------------------------------------------------------
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PRODUCT="Nordic_Blinky"

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Link at the code partition (0x26000) so the Adafruit UF2 bootloader on the
# nice!nano can load us, and emit a .uf2 for drag-and-drop flashing.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BUILD_OUTPUT_UF2=y
